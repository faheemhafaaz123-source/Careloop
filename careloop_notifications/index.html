<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: var(--text-color, #333); }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #7652c8; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 9px; font-size: 13px; }
  </style>
</head>
<body>
  <button id="enable">Enable Notifications</button>
  <div id="status">Chrome notifications are not registered on this device yet.</div>
  <script>
    const statusEl = document.getElementById("status");
    const button = document.getElementById("enable");
    let args = {};

    function sendValue(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value,
        dataType: "json"
      }, "*");
    }
    function setHeight() {
      window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:setFrameHeight", height:105}, "*");
    }
    window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:componentReady", apiVersion:1}, "*");
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        args = event.data.args || {};
        setHeight();
      }
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      statusEl.textContent = "Requesting permission and registering this browser…";
      try {
        if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
          statusEl.textContent = "This browser context does not support web push.";
          sendValue("unsupported");
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          statusEl.textContent = "Notification permission was not granted.";
          sendValue("permission-denied");
          return;
        }

        const appSdk = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
        const messagingSdk = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js");

        const firebaseConfig = args.firebase_config;
        if (!firebaseConfig || !args.vapid_key) throw new Error("Firebase web settings are missing.");

        const app = appSdk.getApps().length ? appSdk.getApp() : appSdk.initializeApp(firebaseConfig);
        const messaging = messagingSdk.getMessaging(app);

        // Streamlit serves static files from /app/static when static serving is enabled.
        const swRegistration = await navigator.serviceWorker.register(
          "/app/static/firebase-messaging-sw.js",
          {scope: "/app/static/"}
        );

        const token = await messagingSdk.getToken(messaging, {
          vapidKey: args.vapid_key,
          serviceWorkerRegistration: swRegistration
        });

        if (!token) throw new Error("Firebase did not return an FCM token.");
        statusEl.textContent = "Chrome notifications enabled. Saving this device…";
        sendValue("fcm:" + token);
      } catch (err) {
        console.error("Careloop notification registration:", err);
        statusEl.textContent = "Could not register notifications: " + (err && err.message ? err.message : "unknown error");
        sendValue("error");
      } finally {
        button.disabled = false;
      }
    });
    setHeight();
  </script>
</body>
</html>
